<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TerraScan map — direction C</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>
  <link rel="preload" href="../fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../node_modules/maplibre-gl/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="word" href="index.html">TerraScan</a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Story</a>
      <a href="#">GitHub</a>
      <a class="btn small ghost" href="#own">Map your own area</a>
      <button class="theme" id="theme" type="button">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </nav>
  </header>
  <main class="map-page">
    <div class="map" id="map"></div>
    <div class="tip" id="tip" hidden></div>
    <aside class="panel" aria-label="Map controls">
      <span class="grab" aria-hidden="true"></span>
      <div>
        <h3>City</h3>
        <div class="seg" id="cities" role="group" aria-label="City"></div>
      </div>
      <div>
        <h3>Year</h3>
        <div class="seg" id="years" role="group" aria-label="Year"></div>
      </div>
      <div>
        <h3>Land use, km² (<span data-y0></span> → <span data-y1></span>)</h3>
        <ul class="legend" id="legend"></ul>
      </div>
      <div>
        <h3>Biggest changes</h3>
        <ul class="changes" id="changes"></ul>
        <p class="note">Reported by the model. In Ahmedabad, <span data-rate></span>% of a checked sample were real.</p>
      </div>
      <div>
        <h3>Download</h3>
        <div class="downloads" id="downloads"></div>
      </div>
    </aside>
  </main>
  <script type="module" src="mapview.js"></script>
</body>
</html>
