# Phase 4.5: Ahmedabad change study.
#   Step 4.6 (which scenes exist): python scripts/change_scenes.py --config configs/change.yaml

# Bigger box than steps 4.1/4.2: the city plus the farmland around it, where most
# farmland -> housing change happens. About 30 x 28 km. bbox = [west, south, east, north] lon/lat.
# Chosen by Claude (user agreed, 2026-11-03).
bbox: [72.40, 22.90, 72.70, 23.15]
max_cloud: 10            # percent cloud for the whole scene, same as steps 4.1/4.2

# Months to check, "YYYY-MM" from/to (both included). Dec of the year before is listed too,
# because the dry season (Dec-Feb) crosses the new year. 2026 stops at Oct (last full month).
month_ranges:
  - [2017-12, 2019-12]
  - [2025-12, 2026-10]

scenes_json: results/change_scenes.json
scenes_md: results/change_scenes.md

# Step 4.6 decision (user agreed, 2026-11-03), from results/change_scenes.md / .json:
# compare the same dry-season months, Dec-Feb, in both years. Use only tile 43QBF (UTM zone 43N,
# EPSG:32643); every date also exists in tile 42QZL, and using one tile keeps one grid.
# In tile 43QBF: 13 clear days in the 2018 window (all baseline 02.12, no offset) and 16 in the
# 2026 window (all baseline 05.11/05.12, offset fix needed). The offset is still decided per scene.
tile: 43QBF
years:
  "2018": 2017-12-01/2018-02-28
  "2026": 2025-12-01/2026-02-28

# Step 4.7: build the two maps. Run: python -m src.change --config configs/change.yaml
# Same pipeline settings as steps 4.1/4.2 (calibration fitted on Europe only, used unchanged).
scale_max: 2750
patch_size: 64
calibration_path: results/imagery_calibration.json
cache_dir: imagery/change          # one file per scene read + the composites (git-ignored)

# Fine-tuned model from step 4.4. All 3 seeds are run; maps are drawn from map_seed.
# Areas and changes are reported per seed and as mean +- sample std (user OK'd, 2026-11-03).
model_dir: models/efficientnet_b0_india
seeds: [42, 43, 44]
map_seed: 42
batch_size: 256

# Bias check (user OK'd, 2026-11-03): the model was fine-tuned on 2026 patches from these areas
# (configs/india_eval.yaml finetune_areas, boxes in configs/india.yaml). Patches touching them are
# also left out in a second change matrix, to see how much of the change comes from there.
india_eval_config: configs/india_eval.yaml
india_config: configs/india.yaml

# Map colours, one per class (same order as src/data.py CLASSES).
class_colours:
  AnnualCrop: "#e6c84a"
  Forest: "#1b7837"
  HerbaceousVegetation: "#a6d96a"
  Highway: "#7f7f7f"
  Industrial: "#762a83"
  Pasture: "#d9f0a3"
  PermanentCrop: "#f4a582"
  Residential: "#d73027"
  River: "#4393c3"
  SeaLake: "#08306b"

output_path: results/change_2018_2026.json
patches_csv: results/change_2018_2026_patches.csv
map_figure: reports/figures/change_map_{year}.png      # {year} is filled in
composites_figure: reports/figures/change_composites.jpg   # JPEG keeps the repo light (preview only)

# Step 4.8: sanity-check the change. Run: python -m src.change_check --config configs/change.yaml sample
# A random sample of patches the map seed says changed class. Each pair (2018 left, 2026 right) is
# shown WITHOUT the model's classes; the judge answers "did the land really change?" yes/no/unclear.
# Claude judges first (check_claude_csv), the user reviews in Gradio (check_reviewed_csv).
check_n: 50
check_seed: 42
check_context: 32          # pixels of surroundings shown on each side of the 64x64 patch (outlined)
check_scale: 4             # enlarge each crop 4x (nearest pixel, no smoothing)
check_dir: data/change_check                    # pair images (git-ignored)
check_sample_csv: results/change_check_sample.csv
check_claude_csv: results/change_check_claude.csv
check_reviewed_csv: results/change_check_reviewed.csv
check_output: results/change_check.json
