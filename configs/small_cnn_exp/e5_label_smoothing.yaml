# 2.2c experiment 5: label smoothing 0.1. Only change vs e4 (current best): label_smoothing 0 -> 0.1.
# Why: the target for the true class becomes 0.91 instead of 1 (0.01 for each other class), so the
# model is not pushed to be 100% sure, which often generalises a little better.
# Val loss stays plain cross-entropy, so it compares fairly with the runs before.
run_name: small_cnn_e5_label_smoothing
model: small_cnn
model_args:
  convs: 2
data_config: configs/data.yaml

epochs: 50
lr: 0.001
weight_decay: 0.05
patience: 5          # early stopping: stop after this many epochs without a better val loss
label_smoothing: 0.1

wandb:
  enabled: true
  project: terrascan
