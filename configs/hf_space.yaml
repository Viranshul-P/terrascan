# Step 6.2: build the folder for the Hugging Face Space (the API).
#   python -m src.hf_space --config configs/hf_space.yaml
space_id: viranshul/terrascan-api
model_repo: viranshul/terrascan-efficientnet-b0-india
# The model repo commit the Space downloads from (README-only commits after c8cd4ce did not change the weights).
model_revision: 4bd73b31a2ac07c309f46bc24b2a4adb3ece072d
out_dir: data/hf_space   # git-ignored
copy_dirs: [api, src, configs]
copy_files: [results/imagery_calibration.json]
dockerfile: api/Dockerfile.space
requirements: api/requirements.txt
